<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Reparar instalación</title>
<style>body{font:16px -apple-system,Arial,sans-serif;background:#f4f6f9;color:#101827;margin:0;padding:20px;max-width:560px;margin:auto}
h1{font-size:22px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:14px 16px;margin:12px 0}
.ok{color:#047857;font-weight:700}.bad{color:#b91c1c;font-weight:700}button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;border:0;border-radius:12px;background:#059669;color:#fff;font:700 17px inherit;padding:14px;margin:10px 0;text-decoration:none}
img{width:90px;height:90px;border-radius:20px;background:#ddd;display:block}small{color:#667085}</style></head>
<body><h1>Reparar instalación</h1>
<p><small>Esta página no borra tus datos: solo limpia la copia guardada de la app para que se descargue la versión nueva.</small></p>
<div class="card"><strong>Versión publicada en el sitio</strong><div id="ver">Revisando…</div></div>
<div class="card"><strong>Ícono para la pantalla de inicio</strong><div style="display:flex;gap:14px;align-items:center;margin-top:8px"><img id="ico" alt="" src="apple-touch-icon-v2.png?x=1"><div id="icoSt">Revisando…</div></div></div>
<div class="card"><strong>Copia guardada en este teléfono</strong><div id="sw">Revisando…</div></div>
<button id="fix" type="button">Reparar ahora</button>
<div id="done" class="card" hidden></div>
<a class="btn" href="./index.html" style="background:#101827">Abrir la app</a>
<script>
const $=s=>document.querySelector(s);
fetch('index.html?nocache='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=/Versi[oó]n\s+([0-9.]+)/.exec(t);$('#ver').innerHTML=m?'<span class="ok">Versión '+m[1]+'</span>':'<span class="bad">No se encontró la app en este sitio</span>';}).catch(()=>{$('#ver').innerHTML='<span class="bad">No se pudo leer el sitio</span>';});
$('#ico').onload=()=>{$('#icoSt').innerHTML='<span class="ok">El ícono existe</span>';};$('#ico').onerror=()=>{$('#icoSt').innerHTML='<span class="bad">No se encontró el ícono. La carpeta no se subió completa o en la raíz.</span>';};
async function info(){try{const regs=await navigator.serviceWorker.getRegistrations(),keys=await caches.keys();$('#sw').textContent=regs.length+' servicio(s) guardado(s) · caché: '+(keys.join(', ')||'ninguna');}catch(e){$('#sw').textContent='No disponible';}}
info();
$('#fix').onclick=async()=>{try{const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister();for(const k of await caches.keys())await caches.delete(k);await info();const d=$('#done');d.hidden=false;d.innerHTML='<strong class="ok">Listo.</strong><br>1) Cierra Safari por completo.<br>2) Abre de nuevo el enlace del sitio en <strong>Safari</strong>.<br>3) Toca Compartir → Agregar a pantalla de inicio.';}catch(e){alert('No se pudo limpiar: '+e.message);}};
</script></body></html>
